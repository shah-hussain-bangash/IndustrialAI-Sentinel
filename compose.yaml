services:
  sentinel:
    build: .
    ports:
      - "127.0.0.1:8127:8000"
    environment:
      DEMO_MODE: "true"
      COOKIE_SECURE: "false"
      AUTO_CREATE_SCHEMA: "true"
      DATABASE_URL: "postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:-sentinel-local-demo}@postgres:5432/sentinel"
    volumes:
      - sentinel-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-sentinel-local-demo}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sentinel-data:
  postgres-data:
